{% extends 'base.html' %}

{% block content %}
    <h1>Confirmar eliminación de cliente</h1>

    <p>¿Estás seguro de que deseas eliminar al cliente asociado a la reserva {{ reserva }}?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'lista_reservas_admin' %}">No, cancelar</a>
    </form>
{% endblock %}
