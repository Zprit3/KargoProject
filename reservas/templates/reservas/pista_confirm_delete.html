{% extends 'base.html' %}

{% block title %}¿Estás seguro? - Kargo{% endblock %}


{% block content %}

<h1>Eliminar Pista</h1>

<p>¿Estás seguro de que quieres eliminar la pista "{{ pista.nombre }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'lista_pistas' %}">Cancelar</a>
</form>

{% endblock %}
