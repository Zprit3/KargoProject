{% extends 'base.html' %}

{% block title %}Crear Reserva - Kargo{% endblock %}

{% block content %}
<h1>Crear Reserva</h1>

{% if messages %}
<ul class="messages">
    {% for message in messages %}
    <li {% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ usuario_form.as_p }}
    {{ reserva_form.as_p }}
    <button type="submit">Reservar</button>
</form>

{% endblock %}
