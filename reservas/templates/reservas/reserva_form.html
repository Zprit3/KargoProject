{% extends 'base.html' %}

{% block title %}Modificar Reserva - Kargo{% endblock %}

{% block content %}
    <h1>Modificar Reserva (Reserva #{{ reserva.id }})</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar Cambios</button>
        <a href="{% url 'lista_mis_reservas' %}">Cancelar</a> 
    </form>
{% endblock %}
